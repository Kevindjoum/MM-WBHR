# La méthode avec la fin de HOT-DA fidèle à WBHR (algorithme 3) : surcharges appliquées à methode/config_exemple.yaml.
# Appariement argmax classe -> groupe, projection barycentrique des représentants vers leur groupe, classifieur
# (régression logistique) entraîné sur les points transportés et appliqué à la cible.
fusion:
  dim: 256
phase1:
  epoques: 10
  optimiseur:
    lr_extracteur: 5.0e-5
phase2:
  appariement: argmax
  classifieur: logistique
pseudo:
  actif: true
