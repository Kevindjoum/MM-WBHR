# Configuration de la fusion géométrique pour M modalités.
# L'ordre des modalités compte : avec 2 modalités, la 1re joue le rôle du texte et la 2e celui de l'image
# dans M2CAN (fusion MLB et KL de cohérence identiques).

graine: 123456
appareil: auto            # auto = GPU s'il existe, sinon processeur ; ou cuda, cpu
sortie: sorties/hac_human_s123456

donnees:
  racine: donnees/hac     # format décrit dans donnees.py (voir preparer_hac.py)
  sources: [animal, cartoon]
  cible: human

modalites:                # 2, 3 modalités ou plus
  - nom: audio
    encodeur: {type: caracteristiques, dim: 768}     # AST
  - nom: video
    encodeur: {type: caracteristiques, dim: 2304}    # SlowFast (2048 pour ResNet50)
  # - nom: flot
  #   encodeur: {type: caracteristiques, dim: 2048}
  # Exemples d'encodeurs entraînés de bout en bout (entrées brutes à fournir par le jeu de données) :
  #   encodeur: {type: bert, nom: bert-base-uncased}
  #   encodeur: {type: torchvision, nom: resnet50}

fusion:
  dim: 64                  # dimension de z (64 dans M2CAN)

phase1:
  epoques: 10               # 10 par défaut ; les résultats HAC du dépôt ont été obtenus avec 3
  pas_par_epoque: 3750     # 15 000 exemples cibles par époque avec des lots de 4
  lot: 4                   # exemples par domaine et par pas
  evaluer_tous_les: 750
  tau: 0.07
  poids_tetes: 1.0
  alpha_cmcfa: 1.0
  beta_cdcfa: 1.0
  gamma_supcon_fusion: 1.0
  poids_im: 0.0            # > 0 : maximisation de l'information sur les têtes du lot cible
  normaliser_z: false      # true : SupCon de la fusion sur z normalisé L2 (la géométrie lue par la phase 2)
  cmcfa_cible_debut: 0     # pas avant lequel la cible n'entre pas dans CMCFA (3750 = époque de chauffe, comme M2CAN)
  optimiseur:              # Adam ; taux publiés de M2CAN, décroissance polynomiale
    lr_dorsale: 2.0e-6
    lr_extracteur: 2.0e-6  # très faible : avec des caractéristiques gelées, l'extracteur bouge à peine
    lr_fusion: 5.0e-5
    lr_tetes: 5.0e-5
    puissance: 0.9
    lr_min: 1.0e-8

phase2:
  partition: spectrale     # spectrale (HOT-DA) | equilibree (transport équilibré vers les centres sources)
  affinite: dense          # dense (graphe complet) | knn (graphe des voisins_graphe plus proches voisins)
  voisins_graphe: 15
  plancher: true           # journalise la régression logistique sources -> cible sur z (diagnostic)
  support: 16              # 16 (algorithme 2 de WBHR) | auto (taille moyenne de la classe dans les sources)
  eps: 0.02
  sinkhorn: 60
  point_fixe: 8
  par_classe: 400
  sources_max: null        # nombre max d'exemples par source pour les barycentres (160 dans le code d'origine)
  appariement: hongrois    # hongrois (bijection) | argmax (algorithme 3 de WBHR) | hongrois_accord (départagé par les têtes)
  poids_accord: 1.0        # poids des votes des têtes dans hongrois_accord
  classifieur: aucun       # aucun (classe du groupe) | logistique | voisins : fin de HOT-DA, classifieur entraîné
                           # sur les représentants transportés vers leur groupe apparié, appliqué à la cible
  voisins: 1               # k pour classifieur: voisins

pseudo:
  actif: false             # true = fusion géométrique + pseudo-étiquettes WBHR
  tous_les: 750            # période des tours ; 3750 = un tour par époque, comme M2CAN
  debut: 0                 # premier tour au plus tôt à ce pas ; 3750 = après la première époque, comme M2CAN
  cible_max: 3000
  taux: [0.3, 0.6, 0.9, 1.0]
  filtre: accord           # accord | aucun
  amorcage_tours: 0        # n premiers tours étiquetés par les têtes (confiance, parts égales par classe), pas par WBHR
